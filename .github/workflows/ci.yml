name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CPU_SUITES: '^(repo_guardrails|downstream_consumers|arena_and_elasticity|unicode_bidi_grapheme|layout_clay_flex_grid|fenwick_virtual_list_1m)$'

jobs:
  windows:
    runs-on: windows-latest
    env:
      VSLANG: "1033"
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja and identify vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          choco install ninja --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $revision = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "root=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.vcpkg.outputs.root }}/installed
            ${{ steps.vcpkg.outputs.root }}/downloads
          key: vcpkg-windows-x64-${{ steps.vcpkg.outputs.revision }}-sdl3-harfbuzz-v1
      - name: Install SDL3 and HarfBuzz
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sdl3:x64-windows harfbuzz:x64-windows'
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DETCH_BUILD_EXAMPLES=ON -DETCH_BUILD_TESTS=ON -DETCH_COMPILE_SHADERS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: CPU tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -R "$env:CPU_SUITES"
      - name: Verify clean working tree
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pngs = Get-ChildItem -LiteralPath . -Filter '*.png' -File -Force
          if ($status -or $pngs) {
            Write-Output 'Working tree must be clean and repository root must contain zero PNG files.'
            $status
            $pngs | ForEach-Object { $_.FullName }
            exit 1
          }

  linux:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: release-3.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libharfbuzz-dev fonts-dejavu-core \
            build-essential git libasound2-dev libpulse-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libusb-1.0-0-dev libvulkan-dev
      - name: Use packaged SDL3 when compatible
        id: sdl
        run: |
          version=$(apt-cache policy libsdl3-dev | awk '/Candidate:/ {print $2}')
          # SDL_LoadPNG and SDL_LoadPNG_IO require 3.4.0; 3.2.8 cannot build Etch.
          if [ -n "$version" ] && [ "$version" != '(none)' ] && dpkg --compare-versions "$version" ge 3.4.0; then
            sudo apt-get install -y libsdl3-dev
            echo 'source=false' >> "$GITHUB_OUTPUT"
          else
            echo 'source=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.sdl.outputs.source == 'true'
        id: sdl-cache
        with:
          path: ${{ github.workspace }}/.ci/sdl3
          key: sdl3-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL_VERSION }}-shared-v1
      - name: Build and install SDL3
        if: steps.sdl.outputs.source == 'true' && steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/sdl3" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.ci/sdl3"
          -DETCH_BUILD_EXAMPLES=ON -DETCH_BUILD_TESTS=ON -DETCH_COMPILE_SHADERS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: CPU tests
        run: ctest --test-dir build --output-on-failure -R "$CPU_SUITES"
      - name: Verify clean working tree
        shell: bash
        run: |
          status=$(git status --porcelain)
          pngs=$(find . -maxdepth 1 -type f -name '*.png' -print)
          if [ -n "$status" ] || [ -n "$pngs" ]; then
            echo 'Working tree must be clean and repository root must contain zero PNG files.'
            printf '%s\n' "$status" "$pngs"
            exit 1
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl3 harfbuzz ninja
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DETCH_BUILD_EXAMPLES=ON -DETCH_BUILD_TESTS=ON -DETCH_COMPILE_SHADERS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: CPU tests
        run: ctest --test-dir build --output-on-failure -R "$CPU_SUITES"
      - name: Verify clean working tree
        shell: bash
        run: |
          status=$(git status --porcelain)
          pngs=$(find . -maxdepth 1 -type f -name '*.png' -print)
          if [ -n "$status" ] || [ -n "$pngs" ]; then
            echo 'Working tree must be clean and repository root must contain zero PNG files.'
            printf '%s\n' "$status" "$pngs"
            exit 1
          fi
